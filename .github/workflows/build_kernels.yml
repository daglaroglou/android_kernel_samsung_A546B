name: Build Kernels

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Kernel variant to build"
        required: true
        default: "All variants"
        type: choice
        options:
          - All variants
          - DΛG
          - Permissive
          - KSU
          - KSUN
          - ReSukiSU
          - WildKSU
          - KSU-SUSFS
          - KSUN-SUSFS
          - ReSukiSU-SUSFS
          - WildKSU-SUSFS

permissions:
  contents: write

concurrency:
  group: build-kernels-${{ github.ref }}-${{ github.event.inputs.variant }}
  cancel-in-progress: false

env:
  TOOLCHAIN_DIR: $HOME/toolchain/clang-r450784c
  TOOLCHAIN_ARCHIVE_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r450784/clang-r450784c.tar.gz

jobs:
  notify-start:
    name: Send Start Notification
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout DΛG branch
        uses: actions/checkout@v4
        with:
          ref: "DΛG"

      - name: Send Telegram Start Notification
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F message_thread_id="${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}" \
            -F text="*New DΛG Kernel Build Started!*
            🔗 [View GitHub Actions](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            -F parse_mode="Markdown" \
            -F disable_web_page_preview=true

  build:
    name: Build ${{ matrix.variant }} Kernel
    needs: [notify-start]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: DΛG
            localversion: -DΛG
            ksu_mode: none
            susfs: false
            permissive: false
            extra_ksu_flags: ""
          - variant: Permissive
            localversion: -DΛG-PERMISSIVE
            ksu_mode: none
            susfs: false
            permissive: true
            extra_ksu_flags: ""
          - variant: KSU
            localversion: -DΛG-KSU
            ksu_mode: ksu
            susfs: false
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU"
          - variant: KSUN
            localversion: -DΛG-KSUN
            ksu_mode: ksun
            susfs: false
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU --enable CONFIG_KPROBES"
          - variant: ReSukiSU
            localversion: -DΛG-RESUKISU
            ksu_mode: resukisu
            susfs: false
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU --enable CONFIG_KPM"
          - variant: WildKSU
            localversion: -DΛG-WILDKSU
            ksu_mode: wildksu_canary
            susfs: false
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU --enable CONFIG_KPROBES"
          - variant: KSU-SUSFS
            localversion: -DΛG-KSU_SUSFS
            ksu_mode: ksu
            susfs: true
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU"
          - variant: KSUN-SUSFS
            localversion: -DΛG-KSUN_SUSFS
            ksu_mode: ksun_pershoot
            susfs: true
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU --enable CONFIG_KPROBES --enable CONFIG_TRACEPOINTS"
          - variant: ReSukiSU-SUSFS
            localversion: -DΛG-RESUKISU_SUSFS
            ksu_mode: resukisu_plain
            susfs: true
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU"
          - variant: WildKSU-SUSFS
            localversion: -DΛG-WILDKSU_SUSFS
            ksu_mode: wildksu
            susfs: true
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU --enable CONFIG_KPROBES"

    steps:
      - name: Checkout DΛG branch
        uses: actions/checkout@v4
        with:
          ref: "DΛG"

      - name: Decide whether this variant should run
        id: selector
        run: |
          if [[ "${{ github.event.inputs.variant }}" == "All variants" || "${{ github.event.inputs.variant }}" == "${{ matrix.variant }}" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip non-selected variant
        if: steps.selector.outputs.should_run != 'true'
        run: echo "Skipping ${{ matrix.variant }} because input variant is ${{ github.event.inputs.variant }}"

      - name: Set date and start time
        if: steps.selector.outputs.should_run == 'true'
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Download Apache Arrow's util_free_space.sh
        if: steps.selector.outputs.should_run == 'true'
        run: |
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh

      - name: Install dependencies
        if: steps.selector.outputs.should_run == 'true'
        run: |
          sudo apt update
          sudo apt install -y \
            git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 \
            p7zip-full android-sdk-libsparse-utils erofs-utils default-jdk gnupg flex bison gperf build-essential \
            zip curl libc6-dev libncurses-dev libx11-dev libreadline-dev libgl1 libgl1-mesa-dev bc grep tofrodos \
            python3-markdown libxml2-utils xsltproc libtinfo6 make repo cpio kmod openssl libelf-dev pahole \
            libssl-dev libarchive-tools zstd rsync --fix-missing
          wget https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
          sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb
          rm libtinfo5_6.3-2ubuntu0.1_amd64.deb

      - name: Prepare directories
        if: steps.selector.outputs.should_run == 'true'
        run: |
          mkdir -p "$HOME/toolchain"
          mkdir -p "$TOOLCHAIN_DIR"

      - name: Cache toolchain
        if: steps.selector.outputs.should_run == 'true'
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: clang-r450784c-toolchain

      - name: Fetch toolchain
        if: steps.selector.outputs.should_run == 'true' && steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          wget -c "$TOOLCHAIN_ARCHIVE_URL" -O clang.tar.gz
          tar -xf clang.tar.gz -C "$TOOLCHAIN_DIR"
          rm -f clang.tar.gz

      - name: Fetch AnyKernel3
        if: steps.selector.outputs.should_run == 'true'
        run: |
          git clone --depth=1 --branch a54x https://github.com/daglaroglou/AnyKernel3.git "$HOME/AnyKernel3"

      - name: Import manager driver
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          case "${{ matrix.ksu_mode }}" in
            none)
              echo "No manager driver for this variant" ;;
            ksu)
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main ;;
            ksun)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev ;;
            ksun_pershoot)
              curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs ;;
            resukisu)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main ;;
            resukisu_plain)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash ;;
            wildksu_canary)
              curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s canary ;;
            wildksu)
              curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s wild ;;
            *)
              echo "Unknown manager mode: ${{ matrix.ksu_mode }}" >&2
              exit 1 ;;
          esac

      - name: Apply permissive patch
        if: steps.selector.outputs.should_run == 'true' && matrix.permissive
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          wget https://raw.githubusercontent.com/daglaroglou/a54x_kernel_patches/refs/heads/main/permisssive/set_permissive.patch
          patch -p1 < set_permissive.patch

      - name: Apply WildKSU multi-manager patch
        if: steps.selector.outputs.should_run == 'true' && matrix.variant == 'WildKSU'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/Wild_KSU"
          wget https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/next/susfs_fix_patches/stable/v2.1.0/multi_manager.patch
          patch -p1 < multi_manager.patch

      - name: Configure KernelSU / manager options
        if: steps.selector.outputs.should_run == 'true' && matrix.extra_ksu_flags != ''
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ./scripts/config --file arch/arm64/configs/custom.config ${{ matrix.extra_ksu_flags }}

      - name: Configure permissive options
        if: steps.selector.outputs.should_run == 'true' && matrix.permissive
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ./scripts/config --file arch/arm64/configs/custom.config \
            --enable CONFIG_SECURITY_SELINUX \
            --disable CONFIG_SECURITY_SELINUX_BOOTPARAM \
            --disable CONFIG_SECURITY_SELINUX_DISABLE \
            --enable CONFIG_SECURITY_SELINUX_DEVELOP \
            --enable CONFIG_SECURITY_SELINUX_AVC_STATS \
            --set-val CONFIG_SECURITY_SELINUX_CHECKREQPROT_VALUE 0 \
            --set-val CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS 9 \
            --set-val CONFIG_SECURITY_SELINUX_SID2STR_CACHE_SIZE 256 \
            --enable CONFIG_DEFAULT_SECURITY_SELINUX \
            --set-str CONFIG_DEFAULT_SECURITY "" \
            --set-str CONFIG_CMDLINE "androidboot.selinux=permissive" \
            --enable CONFIG_CMDLINE_EXTEND \
            --enable CONFIG_MODULE_FORCE_UNLOAD \
            --enable CONFIG_MODULE_LOAD \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --disable CONFIG_INTEGRITY \
            --disable CONFIG_INTEGRITY_SIGNATURE \
            --disable CONFIG_INTEGRITY_ASYMMETRIC_KEYS \
            --disable CONFIG_INTEGRITY_TRUSTED_KEYRING \
            --disable CONFIG_INTEGRITY_AUDIT

      - name: Import SUSFS and fetch patch sources
        if: steps.selector.outputs.should_run == 'true' && matrix.susfs
        run: |
          set -euo pipefail
          cd "$HOME"

          case "${{ matrix.variant }}" in
            KSUN-SUSFS)
              git clone --depth=1 -b gki-android13-5.15 https://gitlab.com/daglaroglou/susfs4ksu.git ;;
            *)
              git clone --depth=1 -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git ;;
          esac

          git clone --depth=1 https://github.com/daglaroglou/a54x_kernel_patches.git

          if [[ "${{ matrix.variant }}" == "WildKSU-SUSFS" ]]; then
            git clone --depth=1 https://github.com/WildKernels/kernel_patches.git
          fi

      - name: Copy SUSFS and custom patch files
        if: steps.selector.outputs.should_run == 'true' && matrix.susfs
        run: |
          set -euo pipefail
          cp "$HOME/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" "$GITHUB_WORKSPACE/"
          cp "$HOME/susfs4ksu/kernel_patches/fs/"* "$GITHUB_WORKSPACE/fs/"
          cp "$HOME/susfs4ksu/kernel_patches/include/linux/"* "$GITHUB_WORKSPACE/include/linux/"
          cp "$HOME/a54x_kernel_patches/susfs/2.0.0/"* "$GITHUB_WORKSPACE/"
          cp "$HOME/a54x_kernel_patches/susfs/2.1.0/open-ksu.patch" "$GITHUB_WORKSPACE/"

          if [[ "${{ matrix.variant }}" == "KSU-SUSFS" ]]; then
            cp "$HOME/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" "$GITHUB_WORKSPACE/KernelSU/"
          fi

      - name: Apply SUSFS patch chain
        if: steps.selector.outputs.should_run == 'true' && matrix.susfs
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          patch -p1 < 50_add_susfs_in_gki-android13-5.15.patch
          patch -p1 < exec.patch
          patch -p1 < namespace.patch
          patch -p1 < base.patch
          patch -p1 < open-ksu.patch

          if [[ "${{ matrix.variant }}" == "KSU-SUSFS" ]]; then
            cd "$GITHUB_WORKSPACE/KernelSU"
            patch -p1 < 10_enable_susfs_for_ksu.patch
          fi

          if [[ "${{ matrix.variant }}" == "WildKSU-SUSFS" ]]; then
            cd "$GITHUB_WORKSPACE/Wild_KSU"
            wget https://raw.githubusercontent.com/WildKernels/kernel_patches/refs/heads/main/next/susfs_fix_patches/stable/v2.1.0/multi_manager.patch
            patch -p1 < multi_manager.patch
          fi

      - name: Configure SUSFS option
        if: steps.selector.outputs.should_run == 'true' && matrix.susfs
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ./scripts/config --file arch/arm64/configs/custom.config --enable CONFIG_KSU_SUSFS

      - name: Configure Mountify options
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ./scripts/config --file arch/arm64/configs/custom.config \
            --enable CONFIG_TMPFS_XATTR \
            --enable CONFIG_TMPFS_POSIX_ACL

      - name: Configure localversion
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          ./scripts/config --file arch/arm64/configs/custom.config \
            --set-str CONFIG_LOCALVERSION "${{ matrix.localversion }}" \
            --set-val CONFIG_LOCALVERSION_AUTO n

      - name: Build kernel
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export CONFIGS="a54x_defconfig custom.config"
          export KERNEL_DIR="$GITHUB_WORKSPACE"
          export KBUILD_BUILD_HOST="Github-Actions"
          export KBUILD_BUILD_USER="daglaroglou"
          export PLATFORM_VERSION=16
          export TARGET_SOC=s5e8835
          export DEPMOD=depmod
          MAKE_PARAMS="-j$(nproc --all) ARCH=arm64 KBUILD_OUTPUT=$GITHUB_WORKSPACE/out CC=clang LLVM=1 LLVM_IAS=1 CLANG_TRIPLE=llvm- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make $MAKE_PARAMS $CONFIGS
          make $MAKE_PARAMS

      - name: Verify kernel build
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          IMAGE_PATH="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"
          if [[ ! -f "$IMAGE_PATH" ]]; then
            echo "Error: Kernel Image not found!"
            exit 1
          fi
          ls -la "$IMAGE_PATH"

      - name: Create zip
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          KERNEL_NAME_RAW="${{ matrix.localversion }}"
          KERNEL_NAME_RAW="${KERNEL_NAME_RAW#-}"
          KERNEL_NAME_RELEASE="${KERNEL_NAME_RAW//Λ/A}"

          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" "$HOME/AnyKernel3/"
          cd "$HOME/AnyKernel3"
          7z a "${KERNEL_NAME_RELEASE}.zip" . -xr'!*.git*'

      - name: Upload zipped kernel artifact
        if: steps.selector.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: $HOME/AnyKernel3/*.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [notify-start, build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout DΛG branch
        uses: actions/checkout@v4
        with:
          ref: "DΛG"

      - name: Set date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Read CHANGELOG.md
        id: changelog
        run: |
          CHANGELOG=$(cat CHANGELOG.md)
          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Fetch kernel manager versions
        id: versions
        run: |
          KSU_VERSION=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_OUTPUT"

          KSUN_VERSION=$(curl -s https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "KSUN_VERSION=$KSUN_VERSION" >> "$GITHUB_OUTPUT"

          RESUKISU_VERSION=$(curl -s https://api.github.com/repos/ReSukiSU/ReSukiSU/tags | grep '"name":' | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "RESUKISU_VERSION=$RESUKISU_VERSION" >> "$GITHUB_OUTPUT"

          WILDKSU_VERSION=$(curl -s https://api.github.com/repos/WildKernels/Wild_KSU/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "WILDKSU_VERSION=$WILDKSU_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download all kernel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-*
          path: /home/runner/release
          merge-multiple: true

      - name: Verify downloaded artifacts
        run: |
          set -euo pipefail
          ls -la /home/runner/release
          shopt -s nullglob
          files=(/home/runner/release/*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No kernel zips found to publish."
            exit 1
          fi

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: /home/runner/release/*.zip
          name: DΛG Kernels - ${{ steps.date.outputs.DATE }}
          tag_name: ${{ steps.date.outputs.DATE }}
          overwrite_files: true
          body: |
            ### Changelog
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Kernel managers
            - **KernelSU:** https://github.com/tiann/KernelSU
            - **KernelSU-Next:** https://github.com/KernelSU-Next/KernelSU-Next
            - **ReSukiSU:** https://github.com/ReSukiSU/ReSukiSU (Actions or [nightly.link](https://nightly.link/ReSukiSU/ReSukiSU/workflows/build-manager/main/Manager-release.zip))
            - **WildKSU:** https://github.com/WildKernels/Wild_KSU

            ### SUSFS Module
            - **SUSFS:** https://github.com/sidex15/susfs4ksu-module (Optional for ReSukiSU)

            ### Build Information
            - **Kernel Version:** 5.15.180
            - **Clang Version:** r450784c
            - **KernelSU Version:** ${{ steps.versions.outputs.KSU_VERSION }}
            - **KernelSU-Next Version:** ${{ steps.versions.outputs.KSUN_VERSION }}
            - **ReSukiSU Version:** ${{ steps.versions.outputs.RESUKISU_VERSION }}
            - **WildKSU Version:** ${{ steps.versions.outputs.WILDKSU_VERSION }}
            - **SUSFS Version:** 2.0.0
            ---
            <div align="center">
            力を解き放つ
            </div>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-release:
    name: Send Release Notification
    runs-on: ubuntu-latest
    needs: [publish-release]
    if: always()
    steps:
      - name: Checkout DΛG branch
        uses: actions/checkout@v4
        with:
          ref: "DΛG"

      - name: Set date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Read CHANGELOG
        id: changelog
        run: |
          CHANGELOG=$(cat CHANGELOG.md)
          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send Telegram Release Notification
        run: |
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F message_thread_id="${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}" \
            -F text="*New DΛG Kernel Build Released!*
            *Changelog:*
            \`\`\`
            ${{ steps.changelog.outputs.CHANGELOG }}
            \`\`\`
            📥 [Download from GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/${{ steps.date.outputs.DATE }})" \
            -F parse_mode="Markdown" \
            -F disable_web_page_preview=true
