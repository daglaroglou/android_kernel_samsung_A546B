name: Build Kernels

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Kernel variant to build"
        required: true
        default: "All variants"
        type: choice
        options:
          - All variants
          - DΛG
          - Permissive
          - KSU
          - KSUN
          - ReSukiSU
          - WildKSU
          - KSU-SUSFS
          - KSUN-SUSFS
          - ReSukiSU-SUSFS
          - WildKSU-SUSFS
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        default: false
        type: boolean
      notifications:
        description: "Telegram: post build-start and release messages"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-kernels-${{ github.ref }}-${{ github.event.inputs.variant }}
  cancel-in-progress: false

env:
  TOOLCHAIN_DIR: /home/runner/toolchain/clang-r450784c
  TOOLCHAIN_ARCHIVE_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r450784/clang-r450784c.tar.gz

jobs:
  notify-start:
    name: Send Start Notification
    runs-on: ubuntu-latest
    if: github.event.inputs.notifications == 'true'
    steps:
      - name: Checkout DΛG branch
        uses: actions/checkout@v6
        with:
          ref: "DΛG"

      - name: Send Telegram Start Notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F message_thread_id="${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}" \
            -F parse_mode="Markdown" \
            -F disable_web_page_preview=true \
            -F text="$(printf '%s\n' \
              '🔨 *DΛG Kernel Build Started*' \
              '━━━━━━━━━━━━━━━━━━━━━━' \
              '📦 *Variant:* `${{ github.event.inputs.variant }}`' \
              '🗃️ *Repo:* `${{ github.repository }}`' \
              '🔢 *Run ID:* `${{ github.run_id }}`' \
              '━━━━━━━━━━━━━━━━━━━━━━' \
              '🔗 [Open Actions Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})')"

  build:
    name: Build ${{ matrix.variant }} Kernel
    needs: [notify-start]
    if: ${{ !cancelled() && (needs.notify-start.result == 'success' || needs.notify-start.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: DΛG
            localversion: -DΛG
            ksu_mode: none
            susfs: false
            permissive: false
            extra_ksu_flags: ""
          - variant: Permissive
            localversion: -DΛG-PERMISSIVE
            ksu_mode: none
            susfs: false
            permissive: true
            extra_ksu_flags: ""
          - variant: KSU
            localversion: -DΛG-KSU
            ksu_mode: ksu
            susfs: false
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU"
          - variant: KSUN
            localversion: -DΛG-KSUN
            ksu_mode: ksun
            susfs: false
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU --enable CONFIG_KPROBES"
          - variant: ReSukiSU
            localversion: -DΛG-RESUKISU
            ksu_mode: resukisu
            susfs: false
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU --enable CONFIG_KPM"
          - variant: WildKSU
            localversion: -DΛG-WILDKSU
            ksu_mode: wildksu
            susfs: true
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU --enable CONFIG_KPROBES"
          - variant: KSU-SUSFS
            localversion: -DΛG-KSU_SUSFS
            ksu_mode: ksu
            susfs: true
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU"
          - variant: KSUN-SUSFS
            localversion: -DΛG-KSUN_SUSFS
            ksu_mode: ksun_pershoot
            susfs: true
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU --enable CONFIG_KPROBES --enable CONFIG_TRACEPOINTS"
          - variant: ReSukiSU-SUSFS
            localversion: -DΛG-RESUKISU_SUSFS
            ksu_mode: resukisu_plain
            susfs: true
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU"
          - variant: WildKSU-SUSFS
            localversion: -DΛG-WILDKSU_SUSFS
            ksu_mode: wildksu
            susfs: true
            permissive: false
            extra_ksu_flags: "--enable CONFIG_KSU --enable CONFIG_KPROBES"

    steps:
      - name: Checkout DΛG branch
        uses: actions/checkout@v6
        with:
          ref: "DΛG"

      - name: Decide whether this variant should run
        id: selector
        run: |
          if [[ "${{ github.event.inputs.variant }}" == "All variants" || "${{ github.event.inputs.variant }}" == "${{ matrix.variant }}" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip non-selected variant
        if: steps.selector.outputs.should_run != 'true'
        run: |
          echo "⏭️  Skipping variant '${{ matrix.variant }}' — selected input is '${{ github.event.inputs.variant }}'"

      - name: Set date and start time
        if: steps.selector.outputs.should_run == 'true'
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "START_TIME=$(date +%s)" >> "$GITHUB_ENV"
          echo "📅 Build date: $(date +'%Y-%m-%d %H:%M:%S UTC')"
          echo "🔖 Variant: ${{ matrix.variant }}"

      - name: Download Apache Arrow's util_free_space.sh
        if: steps.selector.outputs.should_run == 'true'
        run: |
          echo "💾 Checking available disk space..."
          curl -L -o util_free_space.sh https://raw.githubusercontent.com/apache/arrow/main/ci/scripts/util_free_space.sh
          chmod +x util_free_space.sh
          ./util_free_space.sh

      - name: Install dependencies
        if: steps.selector.outputs.should_run == 'true'
        run: |
          echo "📦 Updating package lists..."
          sudo apt update

          echo "📦 Installing build dependencies..."
          sudo apt install -y \
            git device-tree-compiler lz4 xz-utils zlib1g-dev openjdk-17-jdk gcc g++ python3 python-is-python3 \
            p7zip-full android-sdk-libsparse-utils erofs-utils default-jdk gnupg flex bison gperf build-essential \
            zip curl libc6-dev libncurses-dev libx11-dev libreadline-dev libgl1 libgl1-mesa-dev bc grep tofrodos \
            python3-markdown libxml2-utils xsltproc libtinfo6 make repo cpio kmod openssl libelf-dev pahole \
            libssl-dev libarchive-tools zstd rsync --fix-missing

          echo "📦 Installing libtinfo5 (legacy ncurses compatibility)..."
          wget -q https://security.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2ubuntu0.1_amd64.deb
          sudo dpkg -i libtinfo5_6.3-2ubuntu0.1_amd64.deb
          rm libtinfo5_6.3-2ubuntu0.1_amd64.deb

          echo "✅ All dependencies installed successfully"

      - name: Prepare directories
        if: steps.selector.outputs.should_run == 'true'
        run: |
          echo "📁 Creating toolchain directory at $TOOLCHAIN_DIR..."
          mkdir -p "$HOME/toolchain"
          mkdir -p "$TOOLCHAIN_DIR"
          echo "✅ Directories ready"

      - name: Cache toolchain
        if: steps.selector.outputs.should_run == 'true'
        id: cache-toolchain
        uses: actions/cache@v5.0.4
        with:
          path: ${{ env.TOOLCHAIN_DIR }}
          key: clang-r450784c-toolchain

      - name: Fetch toolchain
        if: steps.selector.outputs.should_run == 'true' && steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          echo "⬇️  Cache miss — downloading Clang r450784c toolchain..."
          wget -q --show-progress -c "$TOOLCHAIN_ARCHIVE_URL" -O clang.tar.gz
          echo "📂 Extracting toolchain to $TOOLCHAIN_DIR..."
          tar -xf clang.tar.gz -C "$TOOLCHAIN_DIR"
          rm -f clang.tar.gz
          echo "✅ Toolchain ready at $TOOLCHAIN_DIR"

      - name: Toolchain cache hit
        if: steps.selector.outputs.should_run == 'true' && steps.cache-toolchain.outputs.cache-hit == 'true'
        run: echo "⚡ Toolchain restored from cache — skipping download"

      - name: Fetch AnyKernel3
        if: steps.selector.outputs.should_run == 'true'
        run: |
          echo "⬇️  Cloning AnyKernel3 (branch: a54x)..."
          git clone --depth=1 --branch a54x https://github.com/daglaroglou/AnyKernel3.git "$HOME/AnyKernel3"
          echo "✅ AnyKernel3 ready"

      - name: Import manager driver
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "🔧 Setting up kernel manager driver (mode: ${{ matrix.ksu_mode }})..."

          case "${{ matrix.ksu_mode }}" in
            none)
              echo "ℹ️  No manager driver needed for this variant" ;;
            ksu)
              echo "⬇️  Fetching KernelSU (main)..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main ;;
            ksun)
              echo "⬇️  Fetching KernelSU-Next (dev)..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s dev ;;
            ksun_pershoot)
              echo "⬇️  Fetching KernelSU-Next pershoot fork (dev-susfs)..."
              curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s dev-susfs ;;
            resukisu)
              echo "⬇️  Fetching ReSukiSU (main)..."
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main ;;
            resukisu_plain)
              echo "⬇️  Fetching ReSukiSU (plain)..."
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash ;;
            wildksu)
              echo "⬇️  Fetching WildKSU (canary)..."
              curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s canary ;;
            *)
              echo "❌ Unknown manager mode: ${{ matrix.ksu_mode }}" >&2
              exit 1 ;;
          esac

          echo "✅ Manager driver ready"

      - name: Clone Droidspaces-OSS and apply GKI patches
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          DS_SRC="$HOME/Droidspaces-OSS"
          GKI_DIR="$DS_SRC/Documentation/resources/kernel-patches/GKI"
          echo "⬇️  Cloning Droidspaces-OSS..."
          rm -rf "$DS_SRC"
          git clone --depth=1 https://github.com/ravindu644/Droidspaces-OSS.git "$DS_SRC"
          if [[ ! -d "$GKI_DIR" ]]; then
            echo "❌ GKI patch directory not found: $GKI_DIR" >&2
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          mapfile -t patchfiles < <(find "$GKI_DIR" -maxdepth 1 -type f -name '*.patch' -printf '%f\n' | LC_ALL=C sort)
          for base in "${patchfiles[@]}"; do
            f="$GKI_DIR/$base"
            case "$base" in
              01.6.1+_disable_crc_checks_for_lkms.patch)
                echo "⏭️  Skipping $base"
                continue
                ;;
              03.5.10_or_lower_use_android_abi_padding_for_posix_mqueue\ copy.patch)
                echo "⏭️  Skipping $base"
                continue
                ;;
            esac
            echo "📋 Copying $base into kernel tree..."
            cp -v "$f" "$GITHUB_WORKSPACE/"
            echo "🩹 Applying $base..."
            patch -p1 < "$GITHUB_WORKSPACE/$base" || true
          done
          echo "✅ Droidspaces GKI patches applied"

      - name: Apply permissive patch
        if: steps.selector.outputs.should_run == 'true' && matrix.permissive
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "🔓 Applying SELinux permissive patch..."
          wget -q https://raw.githubusercontent.com/daglaroglou/a54x_kernel_patches/refs/heads/main/permisssive/set_permissive.patch
          patch -p1 < set_permissive.patch || true
          echo "✅ Permissive patch applied"

      - name: Configure KernelSU / manager options
        if: steps.selector.outputs.should_run == 'true' && matrix.extra_ksu_flags != ''
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "⚙️  Applying KSU config flags: ${{ matrix.extra_ksu_flags }}"
          ./scripts/config --file arch/arm64/configs/custom.config ${{ matrix.extra_ksu_flags }}
          echo "✅ KSU config flags applied"

      - name: Configure permissive options
        if: steps.selector.outputs.should_run == 'true' && matrix.permissive
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "⚙️  Configuring SELinux permissive options..."
          ./scripts/config --file arch/arm64/configs/custom.config \
            --enable CONFIG_SECURITY_SELINUX \
            --disable CONFIG_SECURITY_SELINUX_BOOTPARAM \
            --disable CONFIG_SECURITY_SELINUX_DISABLE \
            --enable CONFIG_SECURITY_SELINUX_DEVELOP \
            --enable CONFIG_SECURITY_SELINUX_AVC_STATS \
            --set-val CONFIG_SECURITY_SELINUX_CHECKREQPROT_VALUE 0 \
            --set-val CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS 9 \
            --set-val CONFIG_SECURITY_SELINUX_SID2STR_CACHE_SIZE 256 \
            --enable CONFIG_DEFAULT_SECURITY_SELINUX \
            --set-str CONFIG_DEFAULT_SECURITY "" \
            --set-str CONFIG_CMDLINE "androidboot.selinux=permissive" \
            --enable CONFIG_CMDLINE_EXTEND \
            --enable CONFIG_MODULE_FORCE_UNLOAD \
            --enable CONFIG_MODULE_LOAD \
            --enable CONFIG_MODULE_FORCE_LOAD \
            --disable CONFIG_INTEGRITY \
            --disable CONFIG_INTEGRITY_SIGNATURE \
            --disable CONFIG_INTEGRITY_ASYMMETRIC_KEYS \
            --disable CONFIG_INTEGRITY_TRUSTED_KEYRING \
            --disable CONFIG_INTEGRITY_AUDIT
          echo "✅ SELinux permissive config applied"

      - name: Import SUSFS and fetch patch sources
        if: steps.selector.outputs.should_run == 'true' && matrix.susfs
        run: |
          set -euo pipefail
          cd "$HOME"
          echo "⬇️  Cloning SUSFS sources for variant: ${{ matrix.variant }}..."

          case "${{ matrix.variant }}" in
            KSUN-SUSFS)
              git clone --depth=1 -b gki-android13-5.15 https://gitlab.com/daglaroglou/susfs4ksu.git ;;
            *)
              git clone --depth=1 -b gki-android13-5.15 https://gitlab.com/simonpunk/susfs4ksu.git ;;
          esac

          echo "⬇️  Cloning a54x kernel patch sources..."
          git clone --depth=1 https://github.com/daglaroglou/a54x_kernel_patches.git
          echo "✅ SUSFS sources ready"

      - name: Copy SUSFS and custom patch files
        if: steps.selector.outputs.should_run == 'true' && matrix.susfs
        run: |
          set -euo pipefail
          echo "📋 Copying SUSFS patch files into kernel tree..."
          cp "$HOME/susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch" "$GITHUB_WORKSPACE/"
          cp "$HOME/susfs4ksu/kernel_patches/fs/"* "$GITHUB_WORKSPACE/fs/"
          cp "$HOME/susfs4ksu/kernel_patches/include/linux/"* "$GITHUB_WORKSPACE/include/linux/"
          cp "$HOME/a54x_kernel_patches/susfs/2.0.0/"* "$GITHUB_WORKSPACE/"

          if [[ "${{ matrix.variant }}" == "KSUN-SUSFS" ]]; then
            echo "📋 Copying open-ksun.patch (KSUN variant)..."
            cp "$HOME/a54x_kernel_patches/susfs/2.1.0/open-ksun.patch" "$GITHUB_WORKSPACE/"
          else
            echo "📋 Copying open-ksu.patch..."
            cp "$HOME/a54x_kernel_patches/susfs/2.1.0/open-ksu.patch" "$GITHUB_WORKSPACE/"
          fi

          if [[ "${{ matrix.variant }}" == "KSU-SUSFS" ]]; then
            echo "📋 Copying KernelSU SUSFS enablement patch..."
            cp "$HOME/susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch" "$GITHUB_WORKSPACE/KernelSU/"
          fi

          echo "✅ All patch files copied"

      - name: Apply SUSFS patch chain
        if: steps.selector.outputs.should_run == 'true' && matrix.susfs
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          echo "🩹 Applying 50_add_susfs_in_gki-android13-5.15.patch..."
          patch -p1 < 50_add_susfs_in_gki-android13-5.15.patch || true

          echo "🩹 Applying exec.patch..."
          patch -p1 < exec.patch || true

          echo "🩹 Applying namespace.patch..."
          patch -p1 < namespace.patch || true

          echo "🩹 Applying base.patch..."
          patch -p1 < base.patch || true

          if [[ "${{ matrix.variant }}" == "KSUN-SUSFS" ]]; then
            echo "🩹 Applying open-ksun.patch..."
            patch -p1 < open-ksun.patch || true
          else
            echo "🩹 Applying open-ksu.patch..."
            patch -p1 < open-ksu.patch || true
          fi

          if [[ "${{ matrix.variant }}" == "KSU-SUSFS" ]]; then
            echo "🩹 Applying 10_enable_susfs_for_ksu.patch..."
            cd "$GITHUB_WORKSPACE/KernelSU"
            patch -p1 < 10_enable_susfs_for_ksu.patch || true
          fi

          echo "✅ SUSFS patch chain applied"

      - name: Configure SUSFS option
        if: steps.selector.outputs.should_run == 'true' && matrix.susfs
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "⚙️  Enabling CONFIG_KSU_SUSFS..."
          ./scripts/config --file arch/arm64/configs/custom.config --enable CONFIG_KSU_SUSFS
          echo "✅ SUSFS config enabled"

      - name: Configure Mountify options
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "⚙️  Enabling Mountify options (TMPFS_XATTR, TMPFS_POSIX_ACL)..."
          ./scripts/config --file arch/arm64/configs/custom.config \
            --enable CONFIG_TMPFS_XATTR \
            --enable CONFIG_TMPFS_POSIX_ACL
          echo "✅ Mountify options configured"

      - name: Configure localversion
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "⚙️  Setting LOCALVERSION to '${{ matrix.localversion }}'..."
          ./scripts/config --file arch/arm64/configs/custom.config \
            --set-str CONFIG_LOCALVERSION "${{ matrix.localversion }}" \
            --set-val CONFIG_LOCALVERSION_AUTO n
          echo "✅ Localversion configured"

      - name: Configure DroidSpaces options
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo "⚙️  Applying DroidSpaces options (namespaces, netfilter, cgroups) to custom.config..."
          ./scripts/config --file arch/arm64/configs/custom.config \
            --enable CONFIG_SYSCTL \
            --enable CONFIG_SYSVIPC \
            --enable CONFIG_POSIX_MQUEUE \
            --enable CONFIG_NAMESPACES \
            --enable CONFIG_PID_NS \
            --enable CONFIG_UTS_NS \
            --enable CONFIG_IPC_NS \
            --enable CONFIG_SECCOMP \
            --enable CONFIG_SECCOMP_FILTER \
            --enable CONFIG_CGROUPS \
            --enable CONFIG_CGROUP_DEVICE \
            --enable CONFIG_CGROUP_PIDS \
            --enable CONFIG_MEMCG \
            --enable CONFIG_CGROUP_SCHED \
            --enable CONFIG_FAIR_GROUP_SCHED \
            --enable CONFIG_CGROUP_FREEZER \
            --enable CONFIG_CGROUP_NET_PRIO \
            --enable CONFIG_DEVTMPFS \
            --enable CONFIG_OVERLAY_FS \
            --enable CONFIG_FW_LOADER \
            --enable CONFIG_FW_LOADER_USER_HELPER \
            --enable CONFIG_FW_LOADER_COMPRESS \
            --enable CONFIG_NET_NS \
            --enable CONFIG_VETH \
            --enable CONFIG_BRIDGE \
            --enable CONFIG_NETFILTER \
            --enable CONFIG_BRIDGE_NETFILTER \
            --enable CONFIG_NETFILTER_ADVANCED \
            --enable CONFIG_NF_CONNTRACK \
            --enable CONFIG_IP_NF_IPTABLES \
            --enable CONFIG_IP_NF_FILTER \
            --enable CONFIG_NF_NAT \
            --enable CONFIG_NF_TABLES \
            --enable CONFIG_IP_NF_TARGET_MASQUERADE \
            --enable CONFIG_NETFILTER_XT_TARGET_MASQUERADE \
            --enable CONFIG_NETFILTER_XT_TARGET_TCPMSS \
            --enable CONFIG_NETFILTER_XT_MATCH_ADDRTYPE \
            --enable CONFIG_NF_CONNTRACK_NETLINK \
            --enable CONFIG_NF_NAT_REDIRECT \
            --enable CONFIG_IP_ADVANCED_ROUTER \
            --enable CONFIG_IP_MULTIPLE_TABLES \
            --set-val CONFIG_ANDROID_PARANOID_NETWORK n \
            --enable CONFIG_NETFILTER_XT_MATCH_COMMENT \
            --enable CONFIG_NETFILTER_XT_MATCH_STATE \
            --enable CONFIG_NETFILTER_XT_MATCH_CONNTRACK \
            --enable CONFIG_NETFILTER_XT_MATCH_MULTIPORT \
            --enable CONFIG_NETFILTER_XT_MATCH_HL \
            --enable CONFIG_NETFILTER_XT_TARGET_REJECT \
            --enable CONFIG_IP_NF_TARGET_REJECT \
            --enable CONFIG_NETFILTER_XT_TARGET_LOG \
            --enable CONFIG_IP_NF_TARGET_ULOG \
            --enable CONFIG_NETFILTER_XT_MATCH_RECENT \
            --enable CONFIG_NETFILTER_XT_MATCH_LIMIT \
            --enable CONFIG_NETFILTER_XT_MATCH_HASHLIMIT \
            --enable CONFIG_NETFILTER_XT_MATCH_OWNER \
            --enable CONFIG_NETFILTER_XT_MATCH_PKTTYPE \
            --enable CONFIG_NETFILTER_XT_MATCH_MARK \
            --enable CONFIG_NETFILTER_XT_TARGET_MARK \
            --enable CONFIG_IP_SET \
            --enable CONFIG_IP_SET_HASH_IP \
            --enable CONFIG_IP_SET_HASH_NET \
            --enable CONFIG_NETFILTER_XT_SET \
            --enable CONFIG_NETFILTER_NETLINK_QUEUE \
            --enable CONFIG_NETFILTER_NETLINK_LOG \
            --enable CONFIG_NETFILTER_XT_TARGET_NFLOG
          echo "✅ DroidSpaces options configured"

      - name: Build kernel
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          export PATH="$TOOLCHAIN_DIR/bin:$PATH"
          export CONFIGS="a54x_defconfig custom.config ds1.config ds2.config"
          export KERNEL_DIR="$GITHUB_WORKSPACE"
          export KBUILD_BUILD_HOST="Github-Actions"
          export KBUILD_BUILD_USER="daglaroglou"
          export PLATFORM_VERSION=16
          export TARGET_SOC=s5e8835
          export DEPMOD=depmod
          MAKE_PARAMS="-j$(nproc --all) ARCH=arm64 KBUILD_OUTPUT=$GITHUB_WORKSPACE/out CC=clang LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"

          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🏗️  Starting kernel build"
          echo "   Variant    : ${{ matrix.variant }}"
          echo "   Version    : ${{ matrix.localversion }}"
          echo "   Threads    : $(nproc --all)"
          echo "   Clang      : $(clang --version | head -1)"
          echo "   Output     : $GITHUB_WORKSPACE/out"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          echo "⚙️  Generating .config from $CONFIGS..."
          make $MAKE_PARAMS $CONFIGS

          echo ""
          echo "🔨 Compiling kernel..."
          BUILD_START=$(date +%s)
          make $MAKE_PARAMS
          BUILD_END=$(date +%s)
          BUILD_ELAPSED=$(( BUILD_END - BUILD_START ))

          echo ""
          echo "✅ Kernel compiled in $(( BUILD_ELAPSED / 60 ))m $(( BUILD_ELAPSED % 60 ))s"
          echo "BUILD_ELAPSED=$BUILD_ELAPSED" >> "$GITHUB_ENV"

      - name: Verify kernel build
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          IMAGE_PATH="$GITHUB_WORKSPACE/out/arch/arm64/boot/Image"
          echo "🔍 Verifying kernel image at $IMAGE_PATH..."
          if [[ ! -f "$IMAGE_PATH" ]]; then
            echo "❌ Kernel Image not found — build may have failed!"
            exit 1
          fi
          IMAGE_SIZE=$(du -sh "$IMAGE_PATH" | cut -f1)
          echo "✅ Kernel Image found — Size: $IMAGE_SIZE"
          echo "IMAGE_SIZE=$IMAGE_SIZE" >> "$GITHUB_ENV"
          ls -lh "$IMAGE_PATH"

      - name: Create zip
        if: steps.selector.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          KERNEL_NAME_RAW="${{ matrix.localversion }}"
          KERNEL_NAME_RAW="${KERNEL_NAME_RAW#-}"
          KERNEL_NAME_RELEASE="${KERNEL_NAME_RAW//Λ/A}"

          echo "📦 Packaging kernel into flashable zip..."
          echo "   Zip name: ${KERNEL_NAME_RELEASE}.zip"
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" "$HOME/AnyKernel3/"
          cd "$HOME/AnyKernel3"
          7z a "${KERNEL_NAME_RELEASE}.zip" . -xr'!*.git*' | tail -1

          ZIP_SIZE=$(du -sh "${KERNEL_NAME_RELEASE}.zip" | cut -f1)
          echo "✅ Zip created — Size: $ZIP_SIZE"
          echo "ZIP_NAME=${KERNEL_NAME_RELEASE}.zip" >> "$GITHUB_ENV"
          echo "ZIP_SIZE=$ZIP_SIZE" >> "$GITHUB_ENV"

      - name: Upload zipped kernel artifact
        if: steps.selector.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: /home/runner/AnyKernel3/*.zip
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    needs: [notify-start, build]
    runs-on: ubuntu-latest
    if: ${{ always() && !cancelled() && (needs.notify-start.result == 'success' || needs.notify-start.result == 'skipped') }}
    steps:
      - name: Checkout DΛG branch
        uses: actions/checkout@v6
        with:
          ref: "DΛG"

      - name: Set date
        id: date
        run: |
          echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "📅 Release date: $(date +'%Y-%m-%d')"

      - name: Read CHANGELOG.md
        id: changelog
        run: |
          echo "📄 Reading CHANGELOG.md..."
          CHANGELOG=$(sed 's/^[[:space:]]*//' CHANGELOG.md)
          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Fetch kernel manager versions
        id: versions
        run: |
          echo "🔍 Fetching latest kernel manager versions..."

          KSU_VERSION=$(curl -s https://api.github.com/repos/tiann/KernelSU/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "   KernelSU        : $KSU_VERSION"
          echo "KSU_VERSION=$KSU_VERSION" >> "$GITHUB_OUTPUT"

          KSUN_VERSION=$(curl -s https://api.github.com/repos/KernelSU-Next/KernelSU-Next/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "   KernelSU-Next   : $KSUN_VERSION"
          echo "KSUN_VERSION=$KSUN_VERSION" >> "$GITHUB_OUTPUT"

          RESUKISU_VERSION=$(curl -s https://api.github.com/repos/ReSukiSU/ReSukiSU/tags | grep '"name":' | sed -E 's/.*"([^"]+)".*/\1/' | head -1)
          echo "   ReSukiSU        : $RESUKISU_VERSION"
          echo "RESUKISU_VERSION=$RESUKISU_VERSION" >> "$GITHUB_OUTPUT"

          WILDKSU_VERSION=$(curl -s https://api.github.com/repos/WildKernels/Wild_KSU/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          echo "   WildKSU         : $WILDKSU_VERSION"
          echo "WILDKSU_VERSION=$WILDKSU_VERSION" >> "$GITHUB_OUTPUT"

          echo "✅ All versions fetched"

      - name: Download all kernel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kernel-*
          path: /home/runner/release
          merge-multiple: true

      - name: Verify downloaded artifacts
        run: |
          set -euo pipefail
          echo "🔍 Verifying downloaded kernel artifacts..."
          ls -lh /home/runner/release
          shopt -s nullglob
          files=(/home/runner/release/*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "❌ No kernel zips found — cannot publish release!"
            exit 1
          fi
          echo "✅ Found ${#files[@]} kernel zip(s) ready to publish"

      - name: Write workflow summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## 🏗️ DΛG Kernel Build Summary
          EOF

          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ### ⚙️ Run Info

          | Field | Value |
          |---|---|
          | **Repository** | \`${{ github.repository }}\` |
          | **Variant** | \`${{ github.event.inputs.variant }}\` |
          | **Date** | \`$(date +'%Y-%m-%d')\` |
          | **Run ID** | [\`${{ github.run_id }}\`](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

          ### 🛠️ Toolchain & Target

          | Field | Value |
          |---|---|
          | **Clang** | \`r450784c\` |
          | **Kernel Version** | \`5.15.180\` |
          | **Architecture** | \`arm64\` |
          | **Target SOC** | \`s5e8835\` |
          | **Android Platform** | \`16\` |
          | **Cross Compile** | \`aarch64-linux-gnu-\` |

          ### 📦 Kernel Managers

          | Manager | Version |
          |---|---|
          | **KernelSU** | \`${{ steps.versions.outputs.KSU_VERSION }}\` |
          | **KernelSU-Next** | \`${{ steps.versions.outputs.KSUN_VERSION }}\` |
          | **ReSukiSU** | \`${{ steps.versions.outputs.RESUKISU_VERSION }}\` |
          | **WildKSU** | \`${{ steps.versions.outputs.WILDKSU_VERSION }}\` |
          | **SUSFS** | \`2.1.0\` |

          ### 💸 Donation Links
          | Field | Value |
          |---|---|
          | **PayPal** | https://paypal.me/daglaroglou |
          | **Revolut** | https://revolut.me/daglaroglouc |
          | **GitHub** | https://github.com/sponsors/daglaroglou |
          | **BTC** | `bc1qp62x7ehcvddyf6yw4ye5dy9uw8hllxhah3u447` |
          | **ETH** | `0xcD6782ADccb748ae13a08fd2A237dABE97Df0074` |
          EOF

      - name: Publish to GitHub
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: /home/runner/release/*.zip
          name: DΛG Kernels - ${{ steps.date.outputs.DATE }}
          tag_name: ${{ steps.date.outputs.DATE }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          overwrite_files: true
          body: |
            ### Changelog
            ${{ steps.changelog.outputs.CHANGELOG }}

            ### Kernel managers
            - **KernelSU:** https://github.com/tiann/KernelSU
            - **KernelSU-Next:** https://github.com/KernelSU-Next/KernelSU-Next
            - **ReSukiSU:** https://github.com/ReSukiSU/ReSukiSU (Actions or [nightly.link](https://nightly.link/ReSukiSU/ReSukiSU/workflows/build-manager/main/Manager-release.zip))
            - **WildKSU:** https://github.com/WildKernels/Wild_KSU

            ### SUSFS Module
            - **SUSFS:** https://github.com/sidex15/susfs4ksu-module (Optional for ReSukiSU)

            ### Build Information
            - **Kernel Version:** 5.15.180
            - **Clang Version:** r450784c
            - **KernelSU Version:** ${{ steps.versions.outputs.KSU_VERSION }}
            - **KernelSU-Next Version:** ${{ steps.versions.outputs.KSUN_VERSION }}
            - **ReSukiSU Version:** ${{ steps.versions.outputs.RESUKISU_VERSION }}
            - **WildKSU Version:** ${{ steps.versions.outputs.WILDKSU_VERSION }}
            - **SUSFS Version:** 2.1.0
            ---
            ### ❤️ Donation Links
            | Field | Value |
            |---|---|
            | **PayPal** | https://paypal.me/daglaroglou |
            | **Revolut** | https://revolut.me/daglaroglouc |
            | **GitHub** | https://github.com/sponsors/daglaroglou |
            | **BTC** | `bc1qp62x7ehcvddyf6yw4ye5dy9uw8hllxhah3u447` |
            | **ETH** | `0xcD6782ADccb748ae13a08fd2A237dABE97Df0074` |
            <div align="center">
            力を解き放つ
            </div>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-release:
    name: Send Release Notification
    runs-on: ubuntu-latest
    needs: [publish-release]
    if: ${{ always() && github.event.inputs.notifications == 'true' }}
    steps:
      - name: Checkout DΛG branch
        uses: actions/checkout@v6
        with:
          ref: "DΛG"

      - name: Set date
        id: date
        run: echo "DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Read CHANGELOG
        id: changelog
        run: |
          CHANGELOG=$(sed 's/^[[:space:]]*//' CHANGELOG.md)
          echo "CHANGELOG<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send Telegram Release Notification
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -F message_thread_id="${{ secrets.TELEGRAM_MESSAGE_THREAD_ID }}" \
            -F parse_mode="Markdown" \
            -F disable_web_page_preview=true \
            -F text="$(printf '%s\n' \
              '🎉 *New DΛG Kernel Release*' \
              '━━━━━━━━━━━━━━━━━━━━━━' \
              '🗓️ *Date:* `${{ steps.date.outputs.DATE }}`' \
              '🗃️ *Repo:* `${{ github.repository }}`' \
              '━━━━━━━━━━━━━━━━━━━━━━' \
              '📝 *Changelog*' \
              '```' \
              '${{ steps.changelog.outputs.CHANGELOG }}' \
              '```' \
              '━━━━━━━━━━━━━━━━━━━━━━' \
              '📥 [Download from GitHub Releases](https://github.com/${{ github.repository }}/releases/tag/${{ steps.date.outputs.DATE }})')"